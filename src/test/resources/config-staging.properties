# Default values for the staging environment.
# Any key can be overridden with a system property, for example: mvn test -Dbrowser=firefox

# Base URL of the application under test.
baseUrl=https://automationexercise.com

# Browser to run tests in: chrome | edge | firefox
browser=chrome

# Set to true for CI runs without a visible browser window.
headless=false

# Maximum time, in seconds, that WebDriverWait waits for an element or page condition.
explicitWaitSeconds=10